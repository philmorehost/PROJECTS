permissions:
  contents: read

jobs:
  policy:
    name: PHP ${{ matrix.php }} fintech policy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check
        run: |
          set -e
          for edition in DGV7.0-SAAS DGV7.0-NON-SAAS; do
            for file in func/bc-fintech-policy.php func/bc-fintech-schema.php func/bc-app-token.php \
                        func/bc-fintech-gate.php func/bc-gateway-policy.php func/bc-connect.php \
                        func/bc-fintech-accounts.php func/bc-service-matrix.php \
                        func/bc-service-matrix-render.php func/bc-account-backfill.php \
                        func/bc-account-backfill-render.php \
                        func/bc-config.php web/Login.php web/api/login.php web/api/logout.php \
                        web/api/profile.php web/BusinessUpgrade.php bc-admin/AccountSettings.php \
                        bc-admin/PaymentGateway.php bc-admin/ServiceControl.php \
                        bc-admin/BusinessKYB.php bc-admin/SupportChat.php bc-admin/ChatSettings.php \
                        func/bc-support-chat.php func/bc-support-chat-schema.php \
                        func/bc-support-chat-widget.php func/bc-fintech-wallet.php \
                        func/bc-dashboard-accounts.php web/ajax-support-chat.php \
                        index-bc-style-template-6.php users-plisio.php \
                        func/bc-fintech-providers.php func/bc-fintech-ledger.php \
                        func/bc-fintech-webhook.php func/bc-fintech-klasha.php \
                        func/bc-fintech-flutterwave.php users-klasha.php \
                        users-flutterwave.php; do
              php -l "VTU/${edition}/${file}"
            done
            # Every app endpoint must parse: these carry the dual-auth bridge.
            find "VTU/${edition}/web/api" -name '*.php' -print0 | xargs -0 -n1 php -l
          done
          php -l VTU/DGV7.0-SAAS/web/api/login-otp.php
          php -l VTU/tests/provider_smoke.php
          php -l VTU/tests/fintech_gate_test.php
      - name: Policy and gate tests
        run: |
          set -e
          php -n VTU/tests/fintech_policy_test.php
          php -n VTU/tests/fintech_gate_test.php
      - name: Editions must ship identical policy files
        run: |
          set -e
          for file in bc-fintech-policy.php bc-fintech-schema.php bc-app-token.php bc-fintech-gate.php \
                      bc-gateway-policy.php bc-fintech-accounts.php bc-service-matrix.php \
                      bc-service-matrix-render.php bc-account-backfill.php bc-account-backfill-render.php \
                      bc-support-chat.php bc-support-chat-schema.php bc-support-chat-widget.php \
                      bc-fintech-wallet.php bc-dashboard-accounts.php \
                      bc-fintech-providers.php bc-fintech-ledger.php bc-fintech-webhook.php \
                      bc-fintech-klasha.php bc-fintech-flutterwave.php; do
            cmp "VTU/DGV7.0-SAAS/func/${file}" "VTU/DGV7.0-NON-SAAS/func/${file}"
          done
          cmp VTU/DGV7.0-SAAS/web/api/logout.php VTU/DGV7.0-NON-SAAS/web/api/logout.php
          # Phase 3 provider webhooks are shared infrastructure and must match.
          cmp VTU/DGV7.0-SAAS/users-klasha.php VTU/DGV7.0-NON-SAAS/users-klasha.php
          cmp VTU/DGV7.0-SAAS/users-flutterwave.php VTU/DGV7.0-NON-SAAS/users-flutterwave.php
          # Step 2 pages and the private upload guard must match too.
          cmp VTU/DGV7.0-SAAS/web/BusinessUpgrade.php VTU/DGV7.0-NON-SAAS/web/BusinessUpgrade.php
          cmp VTU/DGV7.0-SAAS/bc-admin/BusinessKYB.php VTU/DGV7.0-NON-SAAS/bc-admin/BusinessKYB.php
          cmp VTU/DGV7.0-SAAS/uploads/kyb/.htaccess VTU/DGV7.0-NON-SAAS/uploads/kyb/.htaccess
          # Phase 2: shared customer-facing pages must match across editions.
          cmp VTU/DGV7.0-SAAS/index-bc-style-template-6.php VTU/DGV7.0-NON-SAAS/index-bc-style-template-6.php
          cmp VTU/DGV7.0-SAAS/web/ajax-support-chat.php VTU/DGV7.0-NON-SAAS/web/ajax-support-chat.php
          cmp VTU/DGV7.0-SAAS/bc-admin/SupportChat.php VTU/DGV7.0-NON-SAAS/bc-admin/SupportChat.php
          cmp VTU/DGV7.0-SAAS/bc-admin/ChatSettings.php VTU/DGV7.0-NON-SAAS/bc-admin/ChatSettings.php
          # The chat endpoint must bind the user to the session, never to the request body.
          for edition in DGV7.0-SAAS DGV7.0-NON-SAAS; do
            if grep -qE '\$_(POST|GET|REQUEST)\[.user_id.\]' "VTU/${edition}/web/ajax-support-chat.php"; then
              echo "chat endpoint accepts a client-supplied user id"; exit 1
            fi
            # Neither the widget nor the console may print a stored API key.
            if grep -q 'chat_ai_key' "VTU/${edition}/func/bc-support-chat-widget.php"; then
              echo "chat widget references the API key"; exit 1
            fi
          done
          # KYB documents must never be reachable over HTTP.
          grep -q 'Require all denied' VTU/DGV7.0-SAAS/uploads/kyb/.htaccess
          grep -q 'Require all denied' VTU/DGV7.0-NON-SAAS/uploads/kyb/.htaccess
          # Phase 3: the adapters must never move a balance themselves. bc_fintech_ledger_post()
          # is the only writer for provider money movement.
          for edition in DGV7.0-SAAS DGV7.0-NON-SAAS; do
            for adapter in bc-fintech-klasha.php bc-fintech-flutterwave.php; do
              if grep -qE 'UPDATE[[:space:]]+sas_(users|user_crypto_wallets)' "VTU/${edition}/func/${adapter}"; then
                echo "${adapter} writes a balance directly"; exit 1
              fi
              if grep -qE '\b(chargeUser|updateUserCryptoBalance)[[:space:]]*\(' "VTU/${edition}/func/${adapter}"; then
                echo "${adapter} bypasses the ledger primitive"; exit 1
              fi
            done
            # Klasha's payload crypto is an explicit seam: no cipher may be shipped until the
            # scheme is verified. The 3DES scheme in the brief is UNVERIFIED.
            if grep -qiE 'openssl_(encrypt|decrypt)|CRYPT_(3DES|BF)' "VTU/${edition}/func/bc-fintech-klasha.php"; then
              echo "klasha adapter ships a payload cipher"; exit 1
            fi
            # Webhook endpoints must read the raw body so signatures are checked over the
            # exact delivered bytes.
            grep -q 'bc_fintech_webhook_raw_input()' "VTU/${edition}/users-klasha.php"
            grep -q 'bc_fintech_webhook_raw_input()' "VTU/${edition}/users-flutterwave.php"
            # The ledger moves money and nothing else: the receipt is re-attached by the
            # delivery pipeline, never from inside bc_fintech_ledger_post().
            if grep -qE 'sendVendorEmail|mail[[:space:]]*\(|getUserEmailTemplate' "VTU/${edition}/func/bc-fintech-ledger.php"; then
              echo "bc-fintech-ledger.php does presentation work"; exit 1
            fi
            grep -q 'bc_fintech_webhook_notify(' "VTU/${edition}/func/bc-fintech-webhook.php"
          done
          # The smoke test must stay runnable without a database.
          php -n VTU/tests/provider_smoke.php | grep -q 'not configured'
