permissions:
  contents: read

jobs:
  policy:
    name: PHP ${{ matrix.php }} fintech policy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check
        run: |
          set -e
          for edition in DGV7.0-SAAS DGV7.0-NON-SAAS; do
            for file in func/bc-fintech-policy.php func/bc-fintech-schema.php func/bc-app-token.php \
                        func/bc-fintech-gate.php func/bc-gateway-policy.php func/bc-connect.php \
                        func/bc-fintech-accounts.php func/bc-service-matrix.php \
                        func/bc-service-matrix-render.php func/bc-account-backfill.php \
                        func/bc-account-backfill-render.php \
                        func/bc-config.php func/db-dtl.php func/bc-admin-config.php func/bc-mail-queue.php web/Login.php web/api/login.php web/api/logout.php \
                        web/api/profile.php web/BusinessUpgrade.php bc-admin/AccountSettings.php \
                        bc-admin/PaymentGateway.php bc-admin/ServiceControl.php \
                        bc-admin/BusinessKYB.php bc-admin/SupportChat.php bc-admin/ChatSettings.php \
                        func/bc-support-chat.php func/bc-support-chat-schema.php \
                        func/bc-support-chat-widget.php func/bc-fintech-wallet.php \
                        func/bc-dashboard-accounts.php web/ajax-support-chat.php \
                        index-bc-style-template-6.php users-plisio.php \
                        func/bc-fintech-providers.php func/bc-fintech-ledger.php \
                        func/bc-fintech-webhook.php func/bc-fintech-klasha.php \
                        func/bc-fintech-flutterwave.php users-klasha.php \
                        users-flutterwave.php func/bc-plate-auth.php \
                        func/bc-plate-app.php func/bc-installer-shell.php \
                        web/Dashboard.php \
                        web/Login.php web/Register.php web/PasswordRecovery.php \
                        web/VerifyOTP.php web/SecurityPIN.php web/LockoutResolution.php \
                        web/Inactive.php web/Suspended.php web/Error.php; do
              php -l "VTU/${edition}/${file}"
            done
            # Every console page must parse: the shell migration touches all of them.
            find "VTU/${edition}/web" -maxdepth 1 -name '*.php' -print0 | xargs -0 -n1 php -l
            # Every app endpoint must parse: these carry the dual-auth bridge.
            find "VTU/${edition}/web/api" -name '*.php' -print0 | xargs -0 -n1 php -l
            # Every back-office page must parse: the admin shell migration touches all of them.
            find "VTU/${edition}/bc-admin" -maxdepth 1 -name '*.php' -print0 | xargs -0 -n1 php -l
            if [ -d "VTU/${edition}/bc-spadmin" ]; then
              find "VTU/${edition}/bc-spadmin" -maxdepth 1 -name '*.php' -print0 | xargs -0 -n1 php -l
            fi
          done
          php -l VTU/DGV7.0-SAAS/web/api/login-otp.php
          php -l VTU/tests/provider_smoke.php
          php -l VTU/tests/fintech_gate_test.php
          php -l VTU/tests/plate_migration_test.php
          php -l VTU/tests/plate_bodies.php
          php -l VTU/tests/backoffice_regression_test.php
          php -l VTU/DGV7.0-SAAS/func/bc-spadmin-config.php
          php -l VTU/DGV7.0-SAAS/func/bc-levelup.php
          php -l LM/check-update.php
          php -l LM/includes/github.php
          php -l LM/admin/ajax_upload_update.php
          php -l LM/admin/patch_zip_manifests.php
          php -l VTU/tests/lm_edition_test.php
      - name: Policy and gate tests
        run: |
          set -e
          php -n VTU/tests/fintech_policy_test.php
          php -n VTU/tests/fintech_gate_test.php
          php -n VTU/tests/plate_app_test.php
          php -n VTU/tests/plate_admin_test.php
          php -n VTU/tests/plate_migration_test.php
          php -n VTU/tests/backoffice_regression_test.php
          php -n VTU/tests/lm_edition_test.php
      - name: Apache .htaccess context and parity
        run: |
          set -e
          # Rejects server/vhost-only directives in any .htaccess (the 500 cause), validates
          # container balance and regexes, and requires both editions' root files to be
          # byte-identical.
          python3 VTU/tests/htaccess_context_test.py
          cmp VTU/DGV7.0-SAAS/.htaccess VTU/DGV7.0-NON-SAAS/.htaccess
      - name: Editions must ship identical policy files
        run: |
          set -e
          for file in bc-fintech-policy.php bc-fintech-schema.php bc-app-token.php bc-fintech-gate.php \
                      bc-gateway-policy.php bc-fintech-accounts.php bc-service-matrix.php \
                      bc-service-matrix-render.php bc-account-backfill.php bc-account-backfill-render.php \
                      bc-support-chat.php bc-support-chat-schema.php bc-support-chat-widget.php \
                      bc-fintech-wallet.php bc-dashboard-accounts.php \
                      bc-fintech-providers.php bc-fintech-ledger.php bc-fintech-webhook.php \
                      bc-fintech-klasha.php bc-fintech-flutterwave.php \
                      bc-plate-auth.php bc-plate-app.php bc-plate-admin.php bc-installer-shell.php; do
            cmp "VTU/DGV7.0-SAAS/func/${file}" "VTU/DGV7.0-NON-SAAS/func/${file}"
          done
          # Phase 2b: the shared auth shell pages are identical across editions.
          for page in PasswordRecovery.php VerifyOTP.php LockoutResolution.php Inactive.php Suspended.php Error.php; do
            cmp "VTU/DGV7.0-SAAS/web/${page}" "VTU/DGV7.0-NON-SAAS/web/${page}"
          done
          # Login/Register/SecurityPIN legitimately differ (the standalone edition lacks the
          # SAAS hardening), but both editions must use the shell and drop assets-2.
          for page in Login.php Register.php SecurityPIN.php; do
            for edition in DGV7.0-SAAS DGV7.0-NON-SAAS; do
              grep -q 'bc_plate_auth_head(' "VTU/${edition}/web/${page}"
              grep -q 'bc_plate_auth_end(' "VTU/${edition}/web/${page}"
              if grep -q 'assets-2\|web-bg-image' "VTU/${edition}/web/${page}"; then
                echo "${edition} ${page} still loads the retired template"; exit 1
              fi
            done
          done
          cmp VTU/DGV7.0-SAAS/web/api/logout.php VTU/DGV7.0-NON-SAAS/web/api/logout.php
          cmp VTU/DGV7.0-SAAS/func/db-dtl.php VTU/DGV7.0-NON-SAAS/func/db-dtl.php
          # Per-installation credentials are written by the wizards on the server and
          # must never be committed (a committed copy broke every NON-SAAS page).
          if [ -e VTU/DGV7.0-NON-SAAS/func/db-json.php ]; then
            echo "NON-SAAS ships a committed func/db-json.php"; exit 1
          fi
          grep -q 'DGV7.0-NON-SAAS/func/db-json.php' .gitignore
          # Phase 3 provider webhooks are shared infrastructure and must match.
          cmp VTU/DGV7.0-SAAS/users-klasha.php VTU/DGV7.0-NON-SAAS/users-klasha.php
          cmp VTU/DGV7.0-SAAS/users-flutterwave.php VTU/DGV7.0-NON-SAAS/users-flutterwave.php
          # The retired legacy URL and the developer docs that point at the canonical one.
          cmp VTU/DGV7.0-SAAS/web/api/flutterwave_webhook.php VTU/DGV7.0-NON-SAAS/web/api/flutterwave_webhook.php
          cmp VTU/DGV7.0-SAAS/web/APIDocs.php VTU/DGV7.0-NON-SAAS/web/APIDocs.php
          cmp VTU/DGV7.0-SAAS/web/api/MOBILE_APP_SPEC.md VTU/DGV7.0-NON-SAAS/web/api/MOBILE_APP_SPEC.md
          # The installer shell is shared infrastructure: identical across editions.
          cmp VTU/DGV7.0-SAAS/func/bc-installer-shell.php VTU/DGV7.0-NON-SAAS/func/bc-installer-shell.php
          # The app shell is shared infrastructure: identical across editions.
          cmp VTU/DGV7.0-SAAS/func/bc-plate-app.php VTU/DGV7.0-NON-SAAS/func/bc-plate-app.php
          # The first migrated console page. Both editions must use the shell and must not
          # reach for the retired template or the old header/footer partials.
          for edition in DGV7.0-SAAS DGV7.0-NON-SAAS; do
            grep -q 'bc_app_head(' "VTU/${edition}/web/Dashboard.php"
            grep -q 'bc_app_sidebar(' "VTU/${edition}/web/Dashboard.php"
            grep -q 'bc_app_topbar(' "VTU/${edition}/web/Dashboard.php"
            grep -q 'bc_app_foot(' "VTU/${edition}/web/Dashboard.php"
            if grep -q 'assets-2\|bc-header.php\|bc-footer.php' "VTU/${edition}/web/Dashboard.php"; then
              echo "${edition} Dashboard still loads the retired template"; exit 1
            fi
          done
          # Back-office pages use the admin shell and never the legacy chrome partials.
          if grep -rl 'include("../func/bc-admin-header.php")\|include("../func/bc-spadmin-header.php")\|include("../func/bc-admin-footer.php")\|include("../func/bc-spadmin-footer.php")' VTU/DGV7.0-SAAS/bc-admin VTU/DGV7.0-SAAS/bc-spadmin VTU/DGV7.0-NON-SAAS/bc-admin; then
            echo "a back-office page still loads the legacy admin chrome"; exit 1
          fi
          # Both wizards must use the shell, not their retired templates.
          for edition in DGV7.0-SAAS DGV7.0-NON-SAAS; do
            installer="VTU/${edition}/install/index.php"
            [ -f "$installer" ] || installer="VTU/${edition}/install.php"
            grep -q 'bc_installer_head(' "$installer"
            grep -q 'bc_installer_foot(' "$installer"
            if grep -q 'assets-2\|cdn.jsdelivr.net/npm/bootstrap\|install.css' "$installer"; then
              echo "${edition} installer still loads the retired template"; exit 1
            fi
          done
          # Step 2 pages and the private upload guard must match too.
          cmp VTU/DGV7.0-SAAS/web/BusinessUpgrade.php VTU/DGV7.0-NON-SAAS/web/BusinessUpgrade.php
          cmp VTU/DGV7.0-SAAS/bc-admin/BusinessKYB.php VTU/DGV7.0-NON-SAAS/bc-admin/BusinessKYB.php
          cmp VTU/DGV7.0-SAAS/uploads/kyb/.htaccess VTU/DGV7.0-NON-SAAS/uploads/kyb/.htaccess
          # The root .htaccess files must stay byte-identical; a divergence here is what
          # the htaccess context test above rejects.
          cmp VTU/DGV7.0-SAAS/.htaccess VTU/DGV7.0-NON-SAAS/.htaccess
          # Phase 2: shared customer-facing pages must match across editions.
          cmp VTU/DGV7.0-SAAS/index-bc-style-template-6.php VTU/DGV7.0-NON-SAAS/index-bc-style-template-6.php
          cmp VTU/DGV7.0-SAAS/web/ajax-support-chat.php VTU/DGV7.0-NON-SAAS/web/ajax-support-chat.php
          cmp VTU/DGV7.0-SAAS/bc-admin/SupportChat.php VTU/DGV7.0-NON-SAAS/bc-admin/SupportChat.php
          cmp VTU/DGV7.0-SAAS/bc-admin/ChatSettings.php VTU/DGV7.0-NON-SAAS/bc-admin/ChatSettings.php
          # The chat endpoint must bind the user to the session, never to the request body.
          for edition in DGV7.0-SAAS DGV7.0-NON-SAAS; do
            if grep -qE '\$_(POST|GET|REQUEST)\[.user_id.\]' "VTU/${edition}/web/ajax-support-chat.php"; then
              echo "chat endpoint accepts a client-supplied user id"; exit 1
            fi
            # Neither the widget nor the console may print a stored API key.
            if grep -q 'chat_ai_key' "VTU/${edition}/func/bc-support-chat-widget.php"; then
              echo "chat widget references the API key"; exit 1
            fi
          done
          # KYB documents must never be reachable over HTTP.
          grep -q 'Require all denied' VTU/DGV7.0-SAAS/uploads/kyb/.htaccess
          grep -q 'Require all denied' VTU/DGV7.0-NON-SAAS/uploads/kyb/.htaccess
          # Phase 3: the adapters must never move a balance themselves. bc_fintech_ledger_post()
          # is the only writer for provider money movement.
          for edition in DGV7.0-SAAS DGV7.0-NON-SAAS; do
            for adapter in bc-fintech-klasha.php bc-fintech-flutterwave.php; do
              if grep -qE 'UPDATE[[:space:]]+sas_(users|user_crypto_wallets)' "VTU/${edition}/func/${adapter}"; then
                echo "${adapter} writes a balance directly"; exit 1
              fi
              if grep -qE '\b(chargeUser|updateUserCryptoBalance)[[:space:]]*\(' "VTU/${edition}/func/${adapter}"; then
                echo "${adapter} bypasses the ledger primitive"; exit 1
              fi
            done
            # Klasha's payload crypto is an explicit seam: no cipher may be shipped until the
            # scheme is verified. The 3DES scheme in the brief is UNVERIFIED.
            if grep -qiE 'openssl_(encrypt|decrypt)|CRYPT_(3DES|BF)' "VTU/${edition}/func/bc-fintech-klasha.php"; then
              echo "klasha adapter ships a payload cipher"; exit 1
            fi
            # Webhook endpoints must read the raw body so signatures are checked over the
            # exact delivered bytes.
            grep -q 'bc_fintech_webhook_raw_input()' "VTU/${edition}/users-klasha.php"
            grep -q 'bc_fintech_webhook_raw_input()' "VTU/${edition}/users-flutterwave.php"
            # The legacy Flutterwave URL must stay an alias: no writer of its own.
            if grep -qE '\b(chargeUser|chargeOtherUser|updateUserCryptoBalance)[[:space:]]*\(' "VTU/${edition}/web/api/flutterwave_webhook.php"; then
              echo "legacy flutterwave webhook credits on its own"; exit 1
            fi
            if grep -qE 'UPDATE[[:space:]]+sas_(users|user_crypto_wallets)' "VTU/${edition}/web/api/flutterwave_webhook.php"; then
              echo "legacy flutterwave webhook writes a balance"; exit 1
            fi
            grep -q 'bc_flw_handle_webhook(' "VTU/${edition}/web/api/flutterwave_webhook.php"
            # The published developer docs must point at the canonical endpoint.
            grep -q '/users-flutterwave.php' "VTU/${edition}/web/APIDocs.php"
            # The sidebar is grouped into service groups; the flat "Services" heading is gone.
            for group in pay-bills wallet-transfers verify-print tools-api history-tools settings-help; do
              grep -q "'id' => '${group}'" "VTU/${edition}/func/bc-plate-app.php"
            done
            if grep -q "'label' => 'Services'" "VTU/${edition}/func/bc-plate-app.php"; then
              echo "${edition} sidebar still has the flat Services heading"; exit 1
            fi
            # The retired chrome partials are deleted; the shells own the layout.
            for partial in bc-header.php bc-footer.php bc-admin-header.php bc-admin-footer.php bc-admin-header-link.php bc-spadmin-header.php bc-spadmin-footer.php bc-spadmin-header-link.php; do
              if [ -f "VTU/${edition}/func/${partial}" ]; then
                echo "${edition} retired partial func/${partial} still exists"; exit 1
              fi
            done
            # The landing page keeps the reference homepage structure: a sticky navbar, a
            # two-line display headline, a scrolling band, alternating feature rows, a dark
            # analytics band and a multi-column footer. Anchors must resolve to real ids.
            for marker in 'class="pc-header"' 'pk-h1-outline' 'pk-marquee' 'pk-split--rev' 'pc-section--ink' 'pc-footer__grid' 'prefers-reduced-motion'; do
              grep -q "$marker" "VTU/${edition}/index-bc-style-template-6.php"
            done
            # Both account panels render server-side; only visibility is scripted.
            grep -q 'id="pc-services-personal" role="tabpanel"' "VTU/${edition}/index-bc-style-template-6.php"
            grep -q 'id="pc-services-business" role="tabpanel" aria-labelledby="pc-tab-business" hidden' "VTU/${edition}/index-bc-style-template-6.php"
            # No icon font: the landing draws its own inline SVG.
            if grep -qE 'class="[^"]*\bbi bi-' "VTU/${edition}/index-bc-style-template-6.php"; then
              echo "${edition} landing uses an icon-font class"; exit 1
            fi
            # Every in-page anchor must land on an id that exists in the same file.
            if [ -n "$(grep -oE 'href="#[a-z0-9_-]+"' "VTU/${edition}/index-bc-style-template-6.php" | sed 's/href="#//; s/"//' | sort -u | while read -r a; do grep -q "id=\"$a\"" "VTU/${edition}/index-bc-style-template-6.php" || echo "$a"; done)" ]; then
              echo "${edition} landing has an anchor with no matching id"; exit 1
            fi
            # The auth shell is presentation-only: it must never touch a balance, a gateway
            # credential row or an entitlement gate.
            if grep -qE '\b(chargeUser|chargeOtherUser|chargeVendor|updateUserCryptoBalance|bc_fintech_ledger_post)[[:space:]]*\(' "VTU/${edition}/func/bc-plate-auth.php"; then
              echo "${edition} auth shell moves money"; exit 1
            fi
            if grep -qE 'sas_(payment_gateways|bank_transfer_gateways)' "VTU/${edition}/func/bc-plate-auth.php"; then
              echo "${edition} auth shell reads gateway credentials"; exit 1
            fi
            # The ledger moves money and nothing else: the receipt is re-attached by the
            # delivery pipeline, never from inside bc_fintech_ledger_post().
            if grep -qE 'sendVendorEmail|mail[[:space:]]*\(|getUserEmailTemplate' "VTU/${edition}/func/bc-fintech-ledger.php"; then
              echo "bc-fintech-ledger.php does presentation work"; exit 1
            fi
            grep -q 'bc_fintech_webhook_notify(' "VTU/${edition}/func/bc-fintech-webhook.php"
          done
          # The smoke test must stay runnable without a database.
          php -n VTU/tests/provider_smoke.php | grep -q 'not configured'
