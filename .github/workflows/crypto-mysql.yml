name: Crypto MySQL integration
on:
  push:
    paths:
      - 'VTU/**/func/bc-crypto-*.php'
      - 'VTU/**/func/bc-bybit.php'
      - 'VTU/tests/bybit_discovery_test.php'
      - 'VTU/tests/crypto_bybit_identity_test.php'
      - 'VTU/tests/crypto_bybit_address_test.php'
      - 'VTU/tests/crypto_bybit_address_read_test.php'
      - 'VTU/tests/crypto_bybit_deposit_records_test.php'
      - 'VTU/tests/crypto_bybit_deposit_read_test.php'
      - 'VTU/**/func/bc-stepup.php'
      - 'VTU/**/func/bc-incident-wallet.php'
      - 'VTU/tests/vtu_wallet_mysql_cases.php'
      - 'VTU/tests/crypto_mysql_integration.php'
      - 'VTU/tests/crypto_deposits*.php'
      - 'VTU/tests/crypto_custody*.php'
      - 'VTU/tests/crypto_routes*.php'
      - 'VTU/tests/crypto_poll*.php'
      - 'VTU/**/bc-spadmin/CryptoCustody.php'
      - 'VTU/**/bc-admin/CryptoCustody.php'
      - '.github/workflows/crypto-mysql.yml'
  pull_request:
    paths:
      - 'VTU/**/func/bc-crypto-*.php'
      - 'VTU/**/func/bc-bybit.php'
      - 'VTU/tests/bybit_discovery_test.php'
      - 'VTU/tests/crypto_bybit_identity_test.php'
      - 'VTU/tests/crypto_bybit_address_test.php'
      - 'VTU/tests/crypto_bybit_address_read_test.php'
      - 'VTU/tests/crypto_bybit_deposit_records_test.php'
      - 'VTU/tests/crypto_bybit_deposit_read_test.php'
      - 'VTU/**/func/bc-stepup.php'
      - 'VTU/**/func/bc-incident-wallet.php'
      - 'VTU/tests/vtu_wallet_mysql_cases.php'
      - 'VTU/tests/crypto_mysql_integration.php'
      - 'VTU/tests/crypto_deposits*.php'
      - 'VTU/tests/crypto_custody*.php'
      - 'VTU/tests/crypto_routes*.php'
      - 'VTU/tests/crypto_poll*.php'
      - 'VTU/**/bc-spadmin/CryptoCustody.php'
      - 'VTU/**/bc-admin/CryptoCustody.php'
      - '.github/workflows/crypto-mysql.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        edition: [SAAS, NON-SAAS]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-ci-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Custody registry normalization and dual-control checks
        run: php VTU/tests/crypto_custody_test.php
      - name: Protected evidence and management boundary checks
        run: |
          php VTU/tests/crypto_custody_evidence_test.php
          php VTU/tests/crypto_custody_management_test.php
          php -l VTU/DGV7.0-SAAS/bc-spadmin/CryptoCustody.php
          php -l VTU/DGV7.0-SAAS/bc-admin/CryptoCustody.php
          php -l VTU/DGV7.0-NON-SAAS/bc-admin/CryptoCustody.php
      - name: Read-only Bybit identity and discovery contracts without network
        run: |
          php -n -d extension=tokenizer VTU/tests/crypto_bybit_identity_test.php
          php VTU/tests/bybit_discovery_test.php
          php -n -d extension=tokenizer VTU/tests/crypto_bybit_address_test.php
          php -n -d extension=tokenizer VTU/tests/crypto_bybit_address_read_test.php
          php -n -d extension=tokenizer VTU/tests/crypto_bybit_deposit_records_test.php
          php -n -d extension=tokenizer VTU/tests/crypto_bybit_deposit_read_test.php
      - name: Deposit route candidate contracts
        run: |
          php VTU/tests/crypto_routes_test.php
          php VTU/tests/crypto_poll_test.php
          php VTU/tests/crypto_poll_operator_test.php
          php VTU/tests/crypto_poll_overlap_test.php
      - name: Pure deposit validation and state-machine checks
        run: php VTU/tests/crypto_deposits_test.php
      - name: Real InnoDB migrations, rollback and competing connections
        env:
          BC_CRYPTO_TEST_MYSQL: DISPOSABLE_ONLY
          BC_CRYPTO_TEST_HOST: 127.0.0.1
          BC_CRYPTO_TEST_USER: root
          BC_CRYPTO_TEST_PASSWORD: disposable-ci-only
          BC_CRYPTO_TEST_EDITION: '${{ matrix.edition }}'
        run: php VTU/tests/crypto_mysql_integration.php
