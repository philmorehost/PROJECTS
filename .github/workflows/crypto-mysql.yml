name: Crypto MySQL integration
on:
  push:
    paths:
      - 'VTU/**/func/bc-crypto-*.php'
      - 'VTU/**/func/bc-stepup.php'
      - 'VTU/tests/crypto_mysql_integration.php'
      - 'VTU/tests/crypto_deposits*.php'
      - '.github/workflows/crypto-mysql.yml'
  pull_request:
    paths:
      - 'VTU/**/func/bc-crypto-*.php'
      - 'VTU/**/func/bc-stepup.php'
      - 'VTU/tests/crypto_mysql_integration.php'
      - 'VTU/tests/crypto_deposits*.php'
      - '.github/workflows/crypto-mysql.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        edition: [SAAS, NON-SAAS]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-ci-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Pure deposit validation and state-machine checks
        run: php VTU/tests/crypto_deposits_test.php
      - name: Real InnoDB migrations, rollback and competing connections
        env:
          BC_CRYPTO_TEST_MYSQL: DISPOSABLE_ONLY
          BC_CRYPTO_TEST_HOST: 127.0.0.1
          BC_CRYPTO_TEST_USER: root
          BC_CRYPTO_TEST_PASSWORD: disposable-ci-only
          BC_CRYPTO_TEST_EDITION: '${{ matrix.edition }}'
        run: php VTU/tests/crypto_mysql_integration.php
