name: Build Android and iOS apps

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/build-apps.yml"
      - "VTU/ANDROID - iOS/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-apps.yml"
      - "VTU/ANDROID - iOS/**"
  workflow_dispatch:
    inputs:
      android_artifacts:
        description: Android output to rebuild
        type: choice
        options:
          - release
          - debug
          - both
        default: release
        required: true

permissions:
  contents: read

concurrency:
  group: mobile-app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.android_artifacts != 'release'
    name: Android debug — ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: DG7
            project: VTU/ANDROID - iOS/DG7-Android
          - name: JIKABIZ
            project: VTU/ANDROID - iOS/JIKABIZ-Android
          - name: MZEEVTU
            project: VTU/ANDROID - iOS/MZEEVTU-Android

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: ${{ matrix.app.project }}
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app.name }}-android-debug-apk
          path: ${{ matrix.app.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.android_artifacts != 'debug')
    name: Android release — ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: DG7
            project: VTU/ANDROID - iOS/DG7-Android
            keystore_secret: DG7_KEYSTORE_BASE64
            store_password_secret: DG7_KEYSTORE_PASSWORD
            key_password_secret: DG7_KEY_PASSWORD
            key_alias: philmore-datagifting
          - name: JIKABIZ
            project: VTU/ANDROID - iOS/JIKABIZ-Android
            keystore_secret: JIKABIZ_KEYSTORE_BASE64
            store_password_secret: JIKABIZ_KEYSTORE_PASSWORD
            key_password_secret: JIKABIZ_KEY_PASSWORD
            key_alias: philmore-jikabiz
          - name: MZEEVTU
            project: VTU/ANDROID - iOS/MZEEVTU-Android
            keystore_secret: MZEEVTU_KEYSTORE_BASE64
            store_password_secret: MZEEVTU_STORE_PASSWORD
            key_password_secret: MZEEVTU_KEY_PASSWORD
            key_alias: philmore-mzeevtu

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Check release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets[matrix.app.keystore_secret] }}
          KEYSTORE_PASSWORD: ${{ secrets[matrix.app.store_password_secret] }}
          KEY_PASSWORD: ${{ secrets[matrix.app.key_password_secret] }}
        run: |
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=("${{ matrix.app.keystore_secret }}")
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=("${{ matrix.app.store_password_secret }}")
          [[ -n "$KEY_PASSWORD" ]] || missing+=("${{ matrix.app.key_password_secret }}")
          if (( ${#missing[@]} )); then
            printf '::error::Cannot sign %s release. Add these GitHub Actions repository secrets: %s\n' \
              "${{ matrix.app.name }}" "${missing[*]}"
            exit 1
          fi

      - name: Build signed release APK and AAB
        working-directory: ${{ matrix.app.project }}
        env:
          KEYSTORE_BASE64: ${{ secrets[matrix.app.keystore_secret] }}
          KEYSTORE_PASSWORD: ${{ secrets[matrix.app.store_password_secret] }}
          KEY_ALIAS: ${{ matrix.app.key_alias }}
          KEY_PASSWORD: ${{ secrets[matrix.app.key_password_secret] }}
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Verify signed release outputs
        working-directory: ${{ matrix.app.project }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          jarsigner -verify "$aab"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app.name }}-android-release-apk
          path: ${{ matrix.app.project }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app.name }}-android-release-aab
          path: ${{ matrix.app.project }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.android_artifacts != 'release'
    name: iOS Simulator — ${{ matrix.app.name }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: DG7
            project: VTU/ANDROID - iOS/DG7-iOS
            scheme: DG7-iOS
          - name: JIKABIZ
            project: VTU/ANDROID - iOS/JIKABIZ-iOS
            scheme: JIKABIZ-iOS
          - name: MZEEVTU
            project: VTU/ANDROID - iOS/MZEEVTU-iOS
            scheme: MZEEVTU-iOS

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ matrix.app.project }}
        run: xcodegen generate --spec project.yml

      - name: Build iOS Simulator app
        working-directory: ${{ matrix.app.project }}
        shell: bash
        run: |
          set -uo pipefail
          log_file="$RUNNER_TEMP/${{ matrix.app.scheme }}-xcodebuild.log"
          if ! xcodebuild \
            -project "${{ matrix.app.scheme }}.xcodeproj" \
            -scheme "${{ matrix.app.scheme }}" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData/${{ matrix.app.scheme }}" \
            CODE_SIGNING_ALLOWED=NO \
            build >"$log_file" 2>&1; then
              {
                echo "## ${{ matrix.app.name }} iOS build diagnostics"
                echo '```text'
                grep -E 'error:|warning:|fatal error:|BUILD FAILED|SwiftCompile failed' "$log_file" | tail -80 || tail -80 "$log_file"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              grep -E 'error:|fatal error:|BUILD FAILED|SwiftCompile failed' "$log_file" | tail -30 | while IFS= read -r line; do
                echo "::error::$line"
              done
              tail -80 "$log_file"
              exit 1
          fi

      - name: Package iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DerivedData/${{ matrix.app.scheme }}/Build/Products/Debug-iphonesimulator/${{ matrix.app.scheme }}.app"
          test -d "$app_path"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" "$RUNNER_TEMP/${{ matrix.app.name }}-ios-simulator.zip"

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app.name }}-ios-simulator-app
          path: ${{ runner.temp }}/${{ matrix.app.name }}-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
