name: Platform remediation regression checks
on:
  push:
    paths:
      - 'VTU/**/func/bc-enrollment-policy.php'
      - 'VTU/**/func/bc-app-update-*.php'
      - 'VTU/**/cron/process_app_updates.php'
      - 'VTU/**/func/bc-paid-*.php'
      - 'VTU/**/func/bc-gateway-api-settings.php'
      - 'VTU/**/func/bc-fintech-api-access.php'
      - 'VTU/**/bc-admin/PaymentGateway.php'
      - 'VTU/**/bc-spadmin/PaymentGateway.php'
      - 'VTU/**/web/handle_upgrade.php'
      - 'VTU/**/func/bc-tables.php'
      - 'VTU/**/bc-admin/AppUpdateBroadcast.php'
      - 'VTU/**/web/api/app-update.php'
      - 'VTU/**/asset/bc-app-update-otp.js'
      - 'VTU/tests/harness/app-update-otp-ui-test.mjs'
      - 'VTU/**/func/bc-user-api-status.php'
      - 'VTU/**/bc-admin/Users.php'
      - 'VTU/DGV7.0-SAAS/bc-spadmin/Users.php'
      - 'VTU/**/func/bc-marketplace-catalog.php'
      - 'VTU/**/func/bc-price-input.php'
      - 'VTU/**/func/bc-float-services.php'
      - 'VTU/**/func/bc-plate-app.php'
      - 'VTU/**/func/bc-transaction-receipt.php'
      - 'VTU/**/web/api/transactions.php'
      - 'VTU/**/bc-admin/AccountSettings.php'
      - 'VTU/**/bc-admin/FloatServiceIcons.php'
      - 'VTU/**/bc-admin/UserUpgrade.php'
      - 'VTU/DGV7.0-SAAS/bc-spadmin/*API.php'
      - 'VTU/DGV7.0-SAAS/bc-spadmin/ApiEdit.php'
      - 'VTU/DGV7.0-SAAS/bc-spadmin/MarketPlace.php'
      - 'VTU/DGV7.0-SAAS/VendorOrderPortal.php'
      - 'VTU/DGV7.0-SAAS/func/bc-func.php'
      - 'VTU/tests/*test.php'
      - '.github/workflows/platform-remediation.yml'
  pull_request:
    paths:
      - 'VTU/**/func/bc-enrollment-policy.php'
      - 'VTU/**/func/bc-app-update-*.php'
      - 'VTU/**/cron/process_app_updates.php'
      - 'VTU/**/func/bc-paid-*.php'
      - 'VTU/**/func/bc-gateway-api-settings.php'
      - 'VTU/**/func/bc-fintech-api-access.php'
      - 'VTU/**/bc-admin/PaymentGateway.php'
      - 'VTU/**/bc-spadmin/PaymentGateway.php'
      - 'VTU/**/web/handle_upgrade.php'
      - 'VTU/**/func/bc-tables.php'
      - 'VTU/**/bc-admin/AppUpdateBroadcast.php'
      - 'VTU/**/web/api/app-update.php'
      - 'VTU/**/asset/bc-app-update-otp.js'
      - 'VTU/tests/harness/app-update-otp-ui-test.mjs'
      - 'VTU/**/func/bc-user-api-status.php'
      - 'VTU/**/bc-admin/Users.php'
      - 'VTU/DGV7.0-SAAS/bc-spadmin/Users.php'
      - 'VTU/**/func/bc-marketplace-catalog.php'
      - 'VTU/**/func/bc-price-input.php'
      - 'VTU/**/func/bc-float-services.php'
      - 'VTU/**/func/bc-plate-app.php'
      - 'VTU/**/func/bc-transaction-receipt.php'
      - 'VTU/**/web/api/transactions.php'
      - 'VTU/**/bc-admin/AccountSettings.php'
      - 'VTU/**/bc-admin/FloatServiceIcons.php'
      - 'VTU/**/bc-admin/UserUpgrade.php'
      - 'VTU/DGV7.0-SAAS/bc-spadmin/*API.php'
      - 'VTU/DGV7.0-SAAS/bc-spadmin/ApiEdit.php'
      - 'VTU/DGV7.0-SAAS/bc-spadmin/MarketPlace.php'
      - 'VTU/DGV7.0-SAAS/VendorOrderPortal.php'
      - 'VTU/DGV7.0-SAAS/func/bc-func.php'
      - 'VTU/tests/*test.php'
      - '.github/workflows/platform-remediation.yml'
permissions:
  contents: read
jobs:
  remediation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pricing, inventory, security-reset and shortcut regressions
        run: |
          set -e
          exec > >(tee "$RUNNER_TEMP/remediation.log") 2>&1
          trap 'echo "::error::Regression command failed: $BASH_COMMAND"' ERR
          php -n VTU/tests/remediation_pricing_catalog_test.php
          php -n VTU/tests/float_services_test.php
          php -n VTU/tests/receipt_utility_test.php
          php -n VTU/tests/mobile_history_receipt_test.php
          php -n VTU/tests/temporary_vendor_access_test.php
          php -n VTU/tests/plate_app_test.php
          php -n VTU/tests/gateway_verdict_test.php
          php -n VTU/tests/enrollment_password_test.php
          php -n VTU/tests/enrollment_policy_test.php
          php -n -d extension=tokenizer VTU/tests/fintech_gate_test.php
          php -n -d extension=tokenizer VTU/tests/user_action_gate_test.php
          php -n VTU/tests/user_api_status_test.php
          php -n -r 'if (!function_exists("openssl_pkey_new")) { fwrite(STDERR, "OpenSSL required for credential tests\n"); exit(1); }'
          php -n VTU/tests/app_update_settings_test.php
          php -n VTU/tests/app_update_dispatch_test.php
          php -n VTU/tests/app_update_worker_test.php
          php -n VTU/tests/paid_gateway_test.php
          php VTU/DGV7.0-SAAS/cron/process_app_updates.php --help
          BC_APP_UPDATE_WORKER_ENABLED=0 php VTU/DGV7.0-SAAS/cron/process_app_updates.php --vendor=7 --send | grep 'disabled'
          BC_APP_UPDATE_WORKER_ENABLED=0 php VTU/DGV7.0-NON-SAAS/cron/process_app_updates.php --vendor=7 --send | grep 'disabled'
          node VTU/tests/harness/app-update-otp-ui-test.mjs
          for edition in SAAS NON-SAAS; do
            for file in func/bc-enrollment-policy.php func/bc-price-input.php func/bc-float-services.php func/bc-plate-app.php bc-admin/FloatServiceIcons.php bc-admin/AccountSettings.php bc-admin/UserUpgrade.php bc-admin/AppUpdateBroadcast.php func/bc-app-update-validation.php func/bc-app-update-security.php func/bc-app-update-dispatch.php func/bc-app-update-worker.php func/bc-app-update-transport.php cron/process_app_updates.php func/bc-tables.php web/api/app-update.php web/PasswordRecovery.php web/api/transactions.php func/bc-transaction-receipt.php; do
              php -l "VTU/DGV7.0-$edition/$file"
            done
          done
          php -l VTU/DGV7.0-SAAS/func/bc-marketplace-catalog.php
          php -l VTU/DGV7.0-SAAS/bc-spadmin/MarketPlace.php
          php -l VTU/DGV7.0-SAAS/bc-spadmin/CreateAPI.php
          php -l VTU/DGV7.0-SAAS/bc-spadmin/ApiEdit.php

      - name: Surface regression failure diagnostics
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          log=Path(os.environ['RUNNER_TEMP'])/'remediation.log'
          if log.exists():
              lines=[line for line in log.read_text(errors='replace').splitlines() if 'Fatal error' in line or 'Uncaught' in line or 'FAIL:' in line or 'AssertionError' in line]
              for line in lines[:10]:
                  print('::error::'+line.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))

  api-status-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        edition: [SAAS, NON-SAAS]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-ci-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Persist and independently read back API status in disposable MySQL
        env:
          BC_API_STATUS_CI: '1'
          BC_TEST_EDITION: '${{ matrix.edition }}'
        run: php VTU/tests/user_api_status_mysql_test.php

      - name: At-most-one release send attempt on two independent MySQL connections
        env:
          BC_APP_UPDATE_CI: '1'
          BC_TEST_EDITION: '${{ matrix.edition }}'
        run: php VTU/tests/app_update_dispatch_mysql_test.php

      - name: Exact-release approved worker with mocked providers on real MySQL
        env:
          BC_APP_UPDATE_CI: '1'
          BC_TEST_EDITION: '${{ matrix.edition }}'
        run: php VTU/tests/app_update_worker_mysql_test.php

      - name: Atomic account upgrades and paid gateway access with mocked credentials
        env:
          BC_PAID_GATEWAY_CI: '1'
          BC_TEST_EDITION: '${{ matrix.edition }}'
        run: php VTU/tests/paid_gateway_mysql_test.php
