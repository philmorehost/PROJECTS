name: Authenticator setup and settings regressions
on:
  push:
    paths:
      - 'VTU/**/func/bc-totp-setup.php'
      - 'VTU/**/func/bc-enrollment-policy.php'
      - 'VTU/**/func/bc-stepup.php'
      - 'VTU/**/func/bc-plate-admin.php'
      - 'VTU/**/asset/bc-totp-setup.js'
      - 'VTU/**/asset/bc-qrcode.js'
      - 'VTU/**/AccountSettings.php'
      - 'VTU/**/bc-admin/PaymentGateway.php'
      - 'VTU/**/bc-admin/UpdateSystem.php'
      - 'VTU/tests/*setup*'
      - 'VTU/tests/harness/totp-setup-ui-test.mjs'
      - '.github/workflows/totp-setup.yml'
  pull_request:
    paths:
      - 'VTU/**/func/bc-totp-setup.php'
      - 'VTU/**/func/bc-enrollment-policy.php'
      - 'VTU/**/func/bc-stepup.php'
      - 'VTU/**/func/bc-plate-admin.php'
      - 'VTU/**/asset/bc-totp-setup.js'
      - 'VTU/**/asset/bc-qrcode.js'
      - 'VTU/**/AccountSettings.php'
      - 'VTU/**/bc-admin/PaymentGateway.php'
      - 'VTU/**/bc-admin/UpdateSystem.php'
      - 'VTU/tests/*setup*'
      - 'VTU/tests/harness/totp-setup-ui-test.mjs'
      - '.github/workflows/totp-setup.yml'
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - name: Setup security and existing enrollment contracts
        run: |
          php VTU/tests/totp_setup_test.php
          php VTU/tests/settings_setup_regressions_test.php
          php VTU/tests/enrollment_policy_test.php
          php VTU/tests/enrollment_password_test.php
          php VTU/tests/gauthsettings44_test.php
          php VTU/tests/googleauth38_test.php
          php VTU/tests/plate_admin_test.php
          php -l VTU/DGV7.0-SAAS/bc-spadmin/AccountSettings.php
          php -l VTU/DGV7.0-SAAS/bc-admin/UpdateSystem.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inline setup UI behavior
        run: |
          npm ci --ignore-scripts --prefix VTU/tests/harness
          node VTU/tests/harness/totp-setup-ui-test.mjs
