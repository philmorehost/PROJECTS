plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

configurations.all {
    // AGP 7.4.2's bundled aapt2 cannot parse the android-36 (API 36) resource table.
    // Force a newer aapt2 that supports compileSdk 36 (same as MZEEVTU-Android).
    resolutionStrategy.force 'com.android.tools.build:aapt2:8.1.0-10154469'
}

android {
    namespace 'com.jikabiz.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.jikabiz.app"
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "1.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Load signing credentials from key.properties (gitignored).
            // CI writes this file from GitHub Actions secrets; developers create it locally.
            def keyPropsFile = rootProject.file("key.properties")
            def keystoreBase64 = System.getenv("KEYSTORE_BASE64") ?: ""

            if (keyPropsFile.exists()) {
                def keyProps = new Properties()
                keyPropsFile.withInputStream { keyProps.load(it) }
                def ksFile = new File(keyProps['storeFile'] as String)
                if (ksFile.exists()) {
                    storeFile     ksFile
                    storePassword keyProps['storePassword'] as String
                    keyAlias      keyProps['keyAlias'] as String
                    keyPassword   keyProps['keyPassword'] as String
                }
            } else if (keystoreBase64) {
                // Fallback: decode keystore written by CI before key.properties was created
                def keystoreFile = new File("${buildDir}/keystore-release.jks")
                keystoreFile.parentFile.mkdirs()
                keystoreFile.bytes = Base64.decoder.decode(keystoreBase64)
                storeFile     keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias      System.getenv("KEY_ALIAS") ?: ""
                keyPassword   System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release builds REQUIRE a real release keystore — fail loudly instead of silently
            // falling back to debug signing (debug-signed AABs are rejected by Play Store).
            signingConfig signingConfigs.release
        }
        debug {
            // Debug builds are always signed with the default debug keystore
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }
    buildFeatures {
        viewBinding true
        // AGP 8 made BuildConfig opt-in. SplashActivity reads BuildConfig.VERSION_NAME so the
        // splash version label tracks the installed APK; without this the build fails with
        // "Unresolved reference: BuildConfig".
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Force UTF-8 for the Java compiler explicitly — belt-and-suspenders alongside
// gradle.properties' file.encoding/kotlin.daemon.jvmargs settings, since relying on
// inherited JVM defaults for source encoding is what caused hardcoded non-ASCII
// literals (e.g. the Naira "₦" symbol) to get mangled on Windows build machines.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.3'

    // ViewPager2 (for tabbed Fund Wallet)
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Retrofit & Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'

    // Architecture Components
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.6.1'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'

    // Security (EncryptedSharedPreferences)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // WorkManager (bulk background jobs)
    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.15.1'

    // Lottie animations
    implementation 'com.airbnb.android:lottie:6.0.0'

    // Shimmer loading
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Biometric
    implementation 'androidx.biometric:biometric:1.1.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // Firebase Cloud Messaging (push notifications for app-update broadcasts)
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'

    // VoveID SDK for KYC/Identity Verification
    implementation files('libs/VoveSDK-release.aar')
    implementation 'com.github.code-ants:face-tec:9.7.95'
    implementation 'com.google.mlkit:object-detection:17.0.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
