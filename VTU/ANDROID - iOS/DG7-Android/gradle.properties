org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
# The Kotlin compiler runs in its own persistent daemon process that does NOT inherit
# org.gradle.jvmargs above — without this, it falls back to the build machine's default
# platform charset (commonly Windows-1252 on Windows), which silently mangles any
# non-ASCII literal (e.g. the Naira "₦" symbol) baked into .kt source at compile time.
# sun.jnu.encoding covers how the JVM decodes file paths/command-line args from the OS —
# a second, separate Windows-specific gap from file.encoding alone.
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
# AGP 7.4.2's default aapt2 (7.4.2) cannot parse the android-36 resource table.
# Use a newer aapt2 that supports compileSdk 36 (same as MZEEVTU-Android).
android.aapt2Version=8.1.0-10154469
android.suppressUnsupportedCompileSdk=36
