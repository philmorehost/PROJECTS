plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

// AGP 8.5.1+ aligns uncompressed native libraries to 16 KB inside the APK/AAB, which is required
// for Android 15+ 16 KB page size support. Do not downgrade AGP below 8.7.x: the Android SDK's
// aapt2 in AGP 8.x already understands the android-36 (compileSdk 36) resource table, so the old
// `resolutionStrategy.force aapt2:8.1.0` workaround is no longer needed.

android {
    namespace 'com.datagifting.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.datagifting.app"
        minSdk 24
        targetSdk 36
        // Version 7 was consumed by the upload Play accepted before blocking on the 16 KB error,
        // so the corrected bundle uses 8. Must stay above every code already uploaded.
        versionCode 8
        versionName "1.0.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Release signing. Credentials are never committed. Resolution order:
            //   1. key.properties at the project root - storeFile/storePassword/keyAlias/keyPassword
            //      (storeFile may be absolute or relative to the project root)
            //   2. Environment variables - KEYSTORE_FILE or KEYSTORE_BASE64, plus
            //      KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
            //   3. keystore/datagifting-release.jks with the passwords supplied by 1 or 2
            // key.properties is parsed by hand: java.util.Properties treats '\' as an escape
            // character, which silently destroys Windows paths such as C:\keys\app.jks.
            def readProps = { File f ->
                def map = [:]
                if (f != null && f.exists()) {
                    f.eachLine('UTF-8') { line ->
                        def trimmed = line.trim()
                        if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('!')) return
                        int idx = trimmed.indexOf('=')
                        if (idx <= 0) return
                        map[trimmed.substring(0, idx).trim()] = trimmed.substring(idx + 1).trim()
                    }
                }
                return map
            }

            def props = readProps(rootProject.file("key.properties"))

            def setting = { String propName, String envName ->
                String value = props[propName]
                if (!value) value = System.getenv(envName)
                return value ? value.trim() : ''
            }

            def storePath = setting('storeFile', 'KEYSTORE_FILE')
            def storePass = setting('storePassword', 'KEYSTORE_PASSWORD')
            def alias     = setting('keyAlias', 'KEY_ALIAS')
            def keyPass   = setting('keyPassword', 'KEY_PASSWORD')

            File ksFile = null
            if (storePath) {
                ksFile = new File(storePath)
                if (!ksFile.isAbsolute()) ksFile = rootProject.file(storePath)
            } else if (System.getenv('KEYSTORE_BASE64')) {
                ksFile = new File("${buildDir}/keystore-release.jks")
                ksFile.parentFile.mkdirs()
                ksFile.bytes = Base64.decoder.decode(System.getenv('KEYSTORE_BASE64'))
            } else if (rootProject.file('keystore/datagifting-release.jks').exists()) {
                ksFile = rootProject.file('keystore/datagifting-release.jks')
            }

            if (ksFile != null && ksFile.exists() && storePass && alias && keyPass) {
                storeFile     ksFile
                storePassword storePass
                keyAlias      alias
                keyPassword   keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release builds REQUIRE a real release keystore — fail loudly instead of silently
            // falling back to debug signing (debug-signed AABs are rejected by Play Store).
            signingConfig signingConfigs.release
        }
        debug {
            // Debug builds are always signed with the default debug keystore
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }
    buildFeatures {
        viewBinding true
        // AGP 8 made BuildConfig opt-in. SplashActivity reads BuildConfig.VERSION_NAME so the
        // splash version label tracks the installed APK; without this the build fails with
        // "Unresolved reference: BuildConfig".
        buildConfig true
    }

    packaging {
        jniLibs {
            // Native libraries must stay uncompressed and 16 KB-aligned so the app supports
            // Android 15+ devices using 16 KB memory pages. Play rejects bundles that pack them
            // otherwise ("Your app does not support 16 KB memory page sizes").
            useLegacyPackaging = false
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Replace AGP's opaque 'SigningConfig "release" is missing required property "storeFile"'
// with an actionable message naming the exact file/variables that are missing.
gradle.taskGraph.whenReady { graph ->
    boolean signingRelease = graph.allTasks.any { it.name ==~ /(?i).*release.*/ }
    def cfg = project.android.signingConfigs.release
    if (signingRelease && (cfg.storeFile == null || !cfg.storeFile.exists())) {
        throw new GradleException(
            "Release signing is not configured for DG7 (com.datagifting.app).\n" +
            "Play Store only accepts an update signed with the SAME key that signed the\n" +
            "already-published app, so this build must not fall back to debug signing.\n" +
            "Provide the upload keystore by either:\n" +
            "  * creating key.properties in the project root with storeFile/storePassword/keyAlias/keyPassword\n" +
            "  * or exporting KEYSTORE_FILE (or KEYSTORE_BASE64) + KEYSTORE_PASSWORD + KEY_ALIAS + KEY_PASSWORD\n" +
            "See PLAY_STORE_REBUILD.md for how to obtain the key and verify its fingerprint\n" +
            "against Play Console -> Setup -> App integrity -> App signing.")
    }
}
// Force UTF-8 for the Java compiler explicitly — belt-and-suspenders alongside
// gradle.properties' file.encoding/kotlin.daemon.jvmargs settings, since relying on
// inherited JVM defaults for source encoding is what caused hardcoded non-ASCII
// literals (e.g. the Naira "₦" symbol) to get mangled on Windows build machines.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.3'

    // ViewPager2 (for tabbed Fund Wallet)
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Retrofit & Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'

    // Architecture Components
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.6.1'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'

    // Security (EncryptedSharedPreferences)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // WorkManager (bulk background jobs)
    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.15.1'

    // Lottie animations
    implementation 'com.airbnb.android:lottie:6.0.0'

    // Shimmer loading
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Biometric
    implementation 'androidx.biometric:biometric:1.1.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // Firebase Cloud Messaging (push notifications for app-update broadcasts)
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'

    // VoveID SDK for KYC/Identity Verification
    implementation files('libs/VoveSDK-release.aar')
    implementation 'com.github.code-ants:face-tec:9.7.95'
    implementation 'com.google.mlkit:object-detection:17.0.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
