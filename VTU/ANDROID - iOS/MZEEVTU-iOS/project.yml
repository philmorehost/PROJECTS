# XcodeGen configuration for MZEEVTU-iOS.
# Generates a real .xcodeproj so the app can be archived/signed.
#
# This file was MISSING, which is why the iOS CI job never actually built this app: without a
# project.yml the workflow had no .xcodeproj to archive, so it just packaged a list of source
# files and reported success.
#
# Bundle identifier: com.mzeevtu.apprelease (matches MZEEVTU-Android applicationId).
# Build: xcodegen generate  (CI runs this automatically when project.yml exists)
name: MZEEVTU-iOS

options:
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  MZEEVTU-iOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      # The app lives one level down (MZEEVTU-iOS/MZEEVTU-iOS); KYCView.swift sits beside it.
      - MZEEVTU-iOS
      - KYCView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mzeevtu.apprelease
        # Without this the springboard name falls back to the target name.
        INFOPLIST_KEY_CFBundleDisplayName: MZEEVTU
        # Points the app at MZEEVTU-iOS/Assets.xcassets/AppIcon.appiconset. Without it the icon set is
        # copied into the bundle but never used and the app ships with a blank icon, which App Store
        # validation rejects on archive.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # Kept in step with MZEEVTU-Android (versionName 1.0.9 / versionCode 10).
        MARKETING_VERSION: "1.0.9"
        CURRENT_PROJECT_VERSION: "10"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # No speech/AVFoundation use in this app, but the photo/camera keys are required by the KYC
        # upload screen and cost nothing to declare.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Photo library access is used to upload your KYC documents."
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is used to capture your KYC documents and selfie."

    # No Swift Package dependencies: VoveID was removed permanently (VoveSDK was imported by
    # KYCView but no symbol from it was ever used, so the package was dead weight that could fail
    # to resolve at build time).
