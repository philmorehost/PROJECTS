# XcodeGen configuration for JIKABIZ-iOS.
# Generates a real .xcodeproj so the app can be archived/signed.
# Bundle identifier: com.jikabiz.app (matches JIKABIZ-Android applicationId).
# Build: xcodegen generate  (CI runs this automatically when project.yml exists)
name: JIKABIZ-iOS

options:
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  JIKABIZ-iOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - JIKABIZ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jikabiz.app
        # Without this the springboard name falls back to the target name ("JIKABIZ-iOS").
        INFOPLIST_KEY_CFBundleDisplayName: JIKABIZ
        # Points the app at JIKABIZ/Assets.xcassets/AppIcon.appiconset. Without it the icon set
        # is copied into the bundle but never used, and the app ships with the blank default icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # Kept in step with JIKABIZ-Android (versionName 1.0.3 / versionCode 4). They had
        # drifted apart, so the same build was reporting two different versions per platform.
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "4"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # AIChatView drives SFSpeechRecognizer + AVAudioEngine. iOS KILLS the app on the first
        # permission request if these strings are missing — not a warning, a crash.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone access is used to dictate messages to the AI assistant."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech recognition converts your spoken words into text for the AI assistant."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Photo library access is used to upload your KYC documents."
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is used to capture your KYC documents and selfie."

    # No Swift Package dependencies: VoveID was removed permanently (VoveSDK was imported by
    # KYCView but no symbol from it was ever used, so the package was dead weight that could fail
    # to resolve at build time).
