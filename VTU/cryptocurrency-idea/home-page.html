sh,.mz-blink,.mz-ring,.mz-glow1,.mz-glow2,.mz-glow3,.mz-glow4{animation:none}}\ninput:focus,select:focus{outline:3px solid #D90012;outline-offset:1px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family: Inter, system-ui, sans-serif; color: #0B0B0D; background: #F7F7F8; width: 100%; overflow: hidden\" data-canvas-width=\"1440\" data-canvas-height=\"8000\" data-document-role=\"page\" data-label=\"Mzeevtu — Home\">\n\n<!-- NAV -->\n<header style=\"background: #FFFFFF; color: #0B0B0D; border-bottom: 1px solid #ECECEF\">\n<nav style=\"max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<a href=\"#top\" aria-label=\"Mzeevtu home\" style=\"display: flex; align-items: center; text-decoration: none\">\n<img src=\"97433038-e0f1-4457-af4e-c35f315c1ca7\" alt=\"Mzeevtu\" style=\"height: 52px; width: auto; display: block\">\n<\u002Fa>\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px; font-size: 15px; font-weight: 600\">\n<a href=\"#top\" style=\"color: #2B2B31; text-decoration: none\">Personal<\u002Fa>\n<a href=\"#business\" style=\"color: #2B2B31; text-decoration: none\">Business<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: center\">\n<a href=\"#login\" style=\"color: #0B0B0D; text-decoration: none; font-weight: 600; padding: 12px 16px\">Log in<\u002Fa>\n<a href=\"#download\" style=\"background: #D90012; color: #FFFFFF; text-decoration: none; font-weight: 700; padding: 12px 20px; border-radius: 999px; min-height: 20px\">Download app<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n<\u002Fheader>\n\n<!-- HERO -->\n<section id=\"top\" style=\"background: #0B0B0D; color: #FFFFFF; position: relative\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 72px 24px 96px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n<div style=\"flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n<span style=\"ali  #A6A6AE\">Currencies<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Converter (Wise-style) -->\n<div id=\"send\" style=\"flex: 1 1 400px; min-width: 0; max-width: 460px; background: #FFFFFF; color: #0B0B0D; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 30px 80px rgba(0,0,0,0.35)\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700\">Send money<\u002Fh2>\n<span style=\"font-size: 12px; font-weight: 600; color: #55555F; background: #F1F1F3; padding: 6px 10px; border-radius: 999px\">Sample rates<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<label for=\"mz-send\" style=\"font-size: 14px; font-weight: 600; color: #55555F\">You send<\u002Flabel>\n<div style=\"display: flex; border: 1.5px solid #DADADF; border-radius: 16px; overflow: hidden\">\n<input id=\"mz-send\" type=\"number\" min=\"0\" value=\"{{amount}}\" sc-camel-on-change=\"{{onAmount}}\" style=\"flex: 1 1 auto; min-width: 0; border: 0; padding: 16px; font-size: 24px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; color: #0B0B0D; background: transparent\">\n<label for=\"mz-from\" style=\"position: absolute; left: -9999px\">Send currency<\u002Flabel>\n<sc-raw-select id=\"mz-from\" value=\"{{from}}\" sc-camel-on-change=\"{{onFrom}}\" style=\"border: 0; border-left: 1.5px solid #DADADF; background: #F7F7F8; padding: 0 16px; font-size: 16px; font-weight: 700; color: #0B0B0D; min-height: 56px\">\n<sc-for list=\"{{currencies}}\" as=\"c\" hint-placeholder-count=\"6\"><option value=\"{{c.code}}\">{{c.code}}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px; font-size: 14px; color: #55555F\">\n<button type=\"button\" sc-camel-on-click=\"{{swap}}\" aria-label=\"Swap currencies\" style=\"width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid #DADADF; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B0B0D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<span>1 {{from}} = <strong style=\"color: #0B0B0D\">{{rateText}} {{to}}<\u002Fstrong><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<label for=\"mz-get\" style=\"font-size: 14px; font-weight: 600; color: #55555F\">Recipient gets<\u002Flabel>\n<div style=\"display: flex; border: 1.5px solid #DADADF; border-radius: 16px; overflow: hidden\">\n<output id=\"mz-get\" style=\"flex: 1 1 auto; padding: 16px; font-size: 24px; font-weight: 700; font-family: 'Space Grotesk', sans-serif\">{{converted}}<\u002Foutput>\n<label for=\"mz-to\" style=\"position: absolute; left: -9999px\">Receive currency<\u002Flabel>\n<sc-raw-select id=\"mz-to\" value=\"{{to}}\" sc-camel-on-change=\"{{onTo}}\" style=\"border: 0; border-left: 1.5px solid #DADADF; background: #F7F7F8; padding: 0 16px; font-size: 16px; font-weight: 700; color: #0B0B0D; min-height: 56px\">\n<sc-for list=\"{{currencies}}\" as=\"c\" hint-placeholder-count=\"6\"><option value=\"{{c.code}}\">{{c.code}}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #55555F; border-top: 1px solid #F1F1F3; padding-top: 14px\">\n<div style=\"display: flex; justify-content: space-between\"><span>Transfer fee<\u002Fspan><strong style=\"color: #0B0B0D\">[FEE]<\u002Fstrong><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between\"><span>Should arrive<\u002Fspan><strong style=\"color: #0B0B0D\">[ARRIVAL TIME]<\  uppercase; display: flex; flex-direction: column\"><span style=\"background: linear-gradient(180deg, #4A4A55 0%, #0B0B0D 60%, #000000 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 #FFFFFF) drop-shadow(0 3px 0 #B9B9C2) drop-shadow(0 10px 12px rgba(11,11,13,0.25))\">Get USD, GBP and EUR<\u002Fspan><span style=\"background: linear-gradient(180deg, #FF6B6F 0%, #E3001A 50%, #8A000E 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 #FFFFFF) drop-shadow(0 4px 0 #6E000A) drop-shadow(0 12px 14px rgba(217,0,18,0.35))\">accounts in seconds.<\u002Fspan><\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #55555F\">Open local account details in major currencies, receive payments like a local and switch between balances instantly at competitive exchange rates.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 14px; font-size: 16px; font-weight: 500\">\n<div style=\"display: flex; gap: 12px; align-items: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D90012\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Hold [NN]+ currencies in one wallet<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D90012\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Send to [NN]+ countries<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D90012\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002F
