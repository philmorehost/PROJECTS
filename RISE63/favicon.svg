<?php
declare(strict_types=1);

/**
 * Dynamic SVG favicon.
 *
 * The letter is the first grapheme of the administrator-configured site title and the hue is
 * derived from the title, so the icon is stable per installation without storing an image.
 * Served with an ETag so browsers revalidate cheaply instead of re-downloading.
 */

require __DIR__ . '/app/bootstrap.php';

use RISE63\Core\Security;
use RISE63\Core\Settings;

use function RISE63\{favicon_letter, site_title, title_hue};

if (is_file(__DIR__ . '/config/installed.lock')) {
    try {
        Settings::flush();
    } catch (\Throwable) {
        // A favicon must never fail hard: fall through to the default letter.
    }
}

$letter   = favicon_letter();
$title    = site_title();
$hue      = title_hue($title);
$etag     = '"' . substr(hash('sha256', $letter . $title), 0, 24) . '"';

header('Content-Type: image/svg+xml; charset=utf-8');
header('Cache-Control: public, max-age=86400, must-revalidate');
header('ETag: ' . $etag);
header('X-Content-Type-Options: nosniff');

if (trim((string) ($_SERVER['HTTP_IF_NONE_MATCH'] ?? '')) === $etag) {
    http_response_code(304);
    exit;
}

$safeLetter = htmlspecialchars($letter, ENT_QUOTES | ENT_XML1, 'UTF-8');
$fontSize   = mb_strlen($letter) > 1 ? 40 : 60;

echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="' . htmlspecialchars($title, ENT_QUOTES | ENT_XML1, 'UTF-8') . '">'
    . '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
    . '<stop offset="0" stop-color="hsl(' . $hue . ' 82% 52%)"/>'
    . '<stop offset="1" stop-color="hsl(' . (($hue + 28) % 360) . ' 76% 38%)"/>'
    . '</linearGradient></defs>'
    . '<rect width="96" height="96" rx="22" fill="url(#g)"/>'
    . '<text x="48" y="48" fill="#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" '
    . 'font-size="' . $fontSize . '" font-weight="700" text-anchor="middle" dominant-baseline="central">'
    . $safeLetter . '</text></svg>';
