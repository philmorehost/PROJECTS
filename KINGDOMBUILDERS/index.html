<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KBQ — Kingdom Builders Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#06101d;color:#f4f7fb;font:15px Segoe UI,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:420px;width:100%;background:#081a2d;border:1px solid #294b70;border-radius:20px;padding:34px 28px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
.ey{text-align:center;color:#f4c54e;letter-spacing:3px;font-size:11px;font-weight:900;margin-bottom:8px}
h1{text-align:center;font:700 30px/1.2 Georgia,serif;margin:4px 0 4px;color:#f4f7fb}
h1 span{color:#f4c54e}
p.muted{text-align:center;color:#94a9c0;margin:0 0 22px;line-height:1.5}
label{display:block;color:#b9c9da;font-size:13px;margin:14px 0 6px}
input{width:100%;background:#051222;color:#fff;border:1px solid #2e5074;border-radius:9px;padding:12px}
button{width:100%;font:inherit;cursor:pointer;border-radius:9px;padding:13px;font-weight:800;border:0;margin-top:18px}
.primary{background:linear-gradient(135deg,#ffe06a,#e4a82c);color:#101725}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tab{flex:1;background:#0b1d32;border:1px solid #294b70;color:#cfe0f0;padding:10px;border-radius:9px;font-weight:700;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#ffe06a,#e4a82c);color:#101725;border:0}
.panel{display:none}
.panel.active{display:block}
.err{color:#ff9aaa;font-size:13px;margin-top:10px;min-height:16px}
.notice{margin-top:18px;background:#102844;border:1px solid #315679;border-radius:9px;padding:12px 14px;color:#cfe0f0;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="ey">BIBLE TRIVIA • ONLINE TEST</div>
  <h1>Kingdom Builders <span>Quiz</span></h1>
  <p class="muted">40 questions on the Gospels of Matthew &amp; Mark.</p>

  <div class="tabs">
    <button class="tab active" id="tabStudent">Student</button>
    <button class="tab" id="tabAdmin">Administrator</button>
  </div>

  <div class="panel active" id="panelStudent">
    <label>Your full name</label>
    <input id="studentName" placeholder="e.g. John Adewale" autocomplete="name">
    <button class="primary" id="goQuiz">Start Test</button>
    <div class="err" id="studentErr"></div>
    <div class="notice">You'll see full instructions on the next screen before the timer starts. Once you begin, each question is timed — answer and move on. Your score is sent automatically when you finish.</div>
  </div>

  <div class="panel" id="panelAdmin">
    <label>Admin password</label>
    <input id="adminPass" type="password" placeholder="Enter password" autocomplete="current-password">
    <button class="primary" id="goAdmin">Open Dashboard</button>
    <div class="err" id="adminErr"></div>
  </div>
</div>

<script>
const tabStudent=document.getElementById('tabStudent'),tabAdmin=document.getElementById('tabAdmin');
const panelStudent=document.getElementById('panelStudent'),panelAdmin=document.getElementById('panelAdmin');
tabStudent.onclick=()=>{tabStudent.classList.add('active');tabAdmin.classList.remove('active');panelStudent.classList.add('active');panelAdmin.classList.remove('active');};
tabAdmin.onclick=()=>{tabAdmin.classList.add('active');tabStudent.classList.remove('active');panelAdmin.classList.add('active');panelStudent.classList.remove('active');};

document.getElementById('goQuiz').onclick=function(){
  const name=document.getElementById('studentName').value.trim();
  const err=document.getElementById('studentErr');
  if(!name){err.textContent='Please enter your name.';return;}
  err.textContent='';
  sessionStorage.setItem('kbq_student_name',name);
  window.location.href='quiz.html';
};

document.getElementById('goAdmin').onclick=async function(){
  const pass=document.getElementById('adminPass').value;
  const err=document.getElementById('adminErr');
  if(!pass){err.textContent='Enter the admin password.';return;}
  err.textContent='Checking...';
  try{
    const res=await fetch('api.php?action=check_admin&password='+encodeURIComponent(pass));
    const data=await res.json();
    if(data.ok){
      sessionStorage.setItem('kbq_admin_pass',pass);
      window.location.href='admin.html';
    }else{
      err.textContent='Incorrect password.';
    }
  }catch(e){
    err.textContent='Could not reach server. Is api.php uploaded?';
  }
};

document.getElementById('studentName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('goQuiz').click();});
document.getElementById('adminPass').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('goAdmin').click();});
</script>
</body>
</html>
